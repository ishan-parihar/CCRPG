<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">Mysterium — contemplative-assessment developmental RPG</title>
  <desc id="desc">Every encounter is a validated developmental exercise; macro-progression is the eight stages of consciousness, each mapped to an energy ray, from Archaic infrared through Super-Integral white harvest. A 64-cell module architecture spans eight lines of intelligence by eight stages.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E0B14"/>
      <stop offset="1" stop-color="#0A0710"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5C2E91"/>
      <stop offset="0.35" stop-color="#B8860B"/>
      <stop offset="0.65" stop-color="#2E8B8B"/>
      <stop offset="1" stop-color="#F0E6D0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#241A38" stroke-width="2"/>

  <!-- ══════════ LEFT: IDENTITY ══════════ -->
  <g transform="translate(56 36)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="19" letter-spacing="4" fill="#C9A6FF">CONTEMPLATIVE-ASSESSMENT RPG</text>

    <text x="0" y="68" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="60" font-weight="800" fill="#EDE6F5" letter-spacing="-1.5">Mysterium</text>

    <text x="0" y="118" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="22" font-weight="600" fill="#A99AC0">Every encounter is a validated</text>
    <text x="0" y="150" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="22" font-weight="600" fill="#A99AC0">developmental exercise that diagnoses</text>
    <text x="0" y="182" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="22" font-weight="600" fill="#A99AC0">AND evolves the player.</text>

    <text x="0" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" fill="#6E5F87">8 lines × 8 stages · 64 modules · 1280 items</text>
    <text x="0" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" fill="#6E5F87">TypeScript core · TUI + SvelteKit WebUI · PWA/Capacitor</text>
  </g>

  <!-- ══════════ RIGHT: EIGHT-STAGE ARC ══════════ -->
  <g transform="translate(600 30)">
    <text x="0" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="14" letter-spacing="2" fill="#6E5F87">THE ARC OF EIGHT STAGES</text>

    <!-- stage blocks -->
    <g font-family="ui-monospace, Menlo, monospace">
      <rect x="0"   y="34" width="290" height="26" rx="5" fill="#241A38" stroke="#3A2A55"/><text x="10" y="52" font-size="13" fill="#C9A6FF">01 · Archaic</text><text x="260" y="52" font-size="13" fill="#6E5F87" text-anchor="end">Infrared</text>
      <rect x="0"   y="64" width="290" height="26" rx="5" fill="#2A1F3A" stroke="#4A3566"/><text x="10" y="82" font-size="13" fill="#C9A6FF">02 · Magic</text><text x="260" y="82" font-size="13" fill="#6E5F87" text-anchor="end">Magenta</text>
      <rect x="0"   y="94" width="290" height="26" rx="5" fill="#241A38" stroke="#3A2A55"/><text x="10" y="112" font-size="13" fill="#C9A6FF">03 · Power</text><text x="260" y="112" font-size="13" fill="#6E5F87" text-anchor="end">Red</text>
      <rect x="0"   y="124" width="290" height="26" rx="5" fill="#2A1F3A" stroke="#4A3566"/><text x="10" y="142" font-size="13" fill="#C9A6FF">04 · Mythic</text><text x="260" y="142" font-size="13" fill="#6E5F87" text-anchor="end">Amber</text>
      <rect x="0"   y="154" width="290" height="26" rx="5" fill="#241A38" stroke="#3A2A55"/><text x="10" y="172" font-size="13" fill="#C9A6FF">05 · Rational</text><text x="260" y="172" font-size="13" fill="#6E5F87" text-anchor="end">Orange</text>
      <rect x="0"   y="184" width="290" height="26" rx="5" fill="#2A1F3A" stroke="#4A3566"/><text x="10" y="202" font-size="13" fill="#C9A6FF">06 · Pluralistic</text><text x="260" y="202" font-size="13" fill="#6E5F87" text-anchor="end">Green</text>
      <rect x="0"   y="214" width="290" height="26" rx="5" fill="#241A38" stroke="#3A2A55"/><text x="10" y="232" font-size="13" fill="#C9A6FF">07 · Integral</text><text x="260" y="232" font-size="13" fill="#6E5F87" text-anchor="end">Turquoise</text>
      <rect x="0"   y="244" width="290" height="26" rx="5" fill="#B8860B" opacity="0.92"/><text x="10" y="262" font-size="13" font-weight="700" fill="#1A1206">08 · Super-Integral</text><text x="260" y="262" font-size="13" font-weight="700" fill="#7A5312" text-anchor="end">White · harvest</text>
    </g>

    <!-- 64-cell grid hint -->
    <g transform="translate(330 34)">
      <text x="0" y="0" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6E5F87">64-CELL MODULE MATRIX</text>
      <g>
        <!-- 8x8 mini grid -->
        <g stroke="#3A2A55" stroke-width="1.5">
          <rect x="0" y="12" width="184" height="184" rx="6" fill="#120D1C"/>
          <rect x="23" y="12" width="184" height="184" fill="none"/>
          <rect x="0" y="12" width="184" height="184" fill="none"/>
          <path d="M 23 12 V 196 M 46 12 V 196 M 69 12 V 196 M 92 12 V 196 M 115 12 V 196 M 138 12 V 196 M 161 12 V 196" stroke="#241A38"/>
          <path d="M 0 35 H 184 M 0 58 H 184 M 0 81 H 184 M 0 104 H 184 M 0 127 H 184 M 0 150 H 184 M 0 173 H 184" stroke="#241A38"/>
        </g>
        <!-- one lit cell per stage-diagonal -->
        <g>
          <rect x="0"   y="12" width="23" height="23" rx="3" fill="#5C2E91"/>
          <rect x="23"  y="35" width="23" height="23" rx="3" fill="#7A3FA8"/>
          <rect x="46"  y="58" width="23" height="23" rx="3" fill="#8B5CF6"/>
          <rect x="69"  y="81" width="23" height="23" rx="3" fill="#B8860B"/>
          <rect x="92"  y="104" width="23" height="23" rx="3" fill="#2E8B8B"/>
          <rect x="115" y="127" width="23" height="23" rx="3" fill="#45D6C8"/>
          <rect x="138" y="150" width="23" height="23" rx="3" fill="#E0A93C"/>
          <rect x="161" y="173" width="23" height="23" rx="3" fill="#F0E6D0"/>
        </g>
      </g>
      <text x="0" y="216" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6E5F87">8 lines of intelligence × 8 stages</text>
      <text x="0" y="234" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6E5F87">each encounter = one module, 4 modes</text>
    </g>
  </g>
</svg>
