<!DOCTYPE html>
<html lang="en" data-stage="red">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Mysterium — Cognitive Combat</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // A3 fix: Set data-stage from localStorage before first paint to
      // prevent flash of red-themed UI for players at other stages.
      // Runs synchronously in <head> before body renders.
      try {
        var sig = localStorage.getItem('profile:v1');
        if (sig) {
          var parsed = JSON.parse(sig);
          if (parsed && parsed.currentStage) {
            document.documentElement.setAttribute('data-stage', parsed.currentStage.toLowerCase());
          }
        }
      } catch (e) {
        // localStorage unavailable (SSR, private mode) — default 'red' stays.
      }
    </script>
    %sveltekit.head%
  </head>
  <body class="safe-area" data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
