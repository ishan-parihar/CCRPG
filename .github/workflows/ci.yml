name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Generate SvelteKit types
        run: npx svelte-kit sync
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Check Invariants
        run: npm run check:invariants
      - name: Test
        run: npx vitest run
      - name: Build (Cloudflare target)
        run: npm run build
        env:
          BUILD_TARGET: cloudflare
